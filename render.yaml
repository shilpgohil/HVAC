services:
  - type: web
    name: hvac-digital-twin-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SIMULATOR_TICK_RATE_HZ
        value: "1.0"
      - key: SIMULATOR_DEFAULT_SCENARIO
        value: "1"
